services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/code"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes: ["./backend:/code"]
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
